name: Release

# Manual only. Publishing is deliberately not automatic on push to main.
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release: MAJOR.MINOR.PATCH, e.g. 0.1.0'
        required: true
        type: string
      nextVersion:
        description: 'Next development version: MAJOR.MINOR.PATCH, e.g. 0.2.0 (-SNAPSHOT is added for you)'
        required: true
        type: string

permissions:
  contents: write

# Two releases must never interleave their version commits and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # First, before anything is checked out or published.
      - name: Check version format
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          NEXT_VERSION: ${{ inputs.nextVersion }}
        run: |
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for name in RELEASE_VERSION NEXT_VERSION; do
            value=${!name}
            if [[ ! $value =~ $pattern ]]; then
              echo "::error::$name is '$value'. It must be MAJOR.MINOR.PATCH, e.g. 0.1.0, and nothing else."
              exit 1
            fi
          done
          # sort -V orders semantic versions numerically: 0.10.0 after 0.9.0.
          if [[ $NEXT_VERSION == "$RELEASE_VERSION" \
                || $(printf '%s\n%s\n' "$RELEASE_VERSION" "$NEXT_VERSION" | sort -V | tail -n 1) != "$NEXT_VERSION" ]]; then
            echo "::error::nextVersion must be later than releaseVersion."
            exit 1
          fi

      # The release commits back to the branch it ran on; only main is released.
      - name: Check branch
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Releases run from main, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # A full history, so the tag this workflow pushes has ancestry.
          fetch-depth: 0

      - name: Set up JDK and publishing credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> whose id matches
          # <publishingServerId>central</publishingServerId> in the parent POM.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # versions:set at the root rewrites the root version and every module's
      # parent reference. Nothing else carries the version: sibling dependencies
      # use ${project.version}, and the invoker integration tests are filtered
      # with @project.version@.
      - name: Set release version
        run: ./mvnw -B --no-transfer-progress versions:set -DnewVersion='${{ inputs.releaseVersion }}'

      # The full pipeline, integration tests included, on the release version.
      - name: Verify
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # -Prelease (from be.imgn.parent:parent) rejects SNAPSHOT versions and
        # dependencies, attaches sources and javadoc, signs with GPG, and hands
        # the bundle to central-publishing-maven-plugin. The example modules are
        # excluded from the bundle in the root POM. autoPublish is false, so the
        # deployment waits in the Central portal for a human to release it.
        #
        # skipTests and invoker.skip: the Verify step above already ran every
        # test. This step publishes; it does not test.
        run: ./mvnw -B --no-transfer-progress -Prelease -DskipTests -Dinvoker.skip=true deploy

      - name: Tag the release
        # The POM may already sit at the version being released, in which case
        # versions:set changed nothing and there is nothing to commit. That must
        # not fail the run: publishing has already happened by this point.
        run: |
          if git diff --quiet; then
            echo 'Already at ${{ inputs.releaseVersion }}, nothing to commit.'
          else
            git commit -am 'Release ${{ inputs.releaseVersion }}'
          fi
          git tag -a 'v${{ inputs.releaseVersion }}' -m 'Release ${{ inputs.releaseVersion }}'

      - name: Start the next development version
        run: |
          next='${{ inputs.nextVersion }}-SNAPSHOT'
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$next"
          git commit -am "Start $next"
          git push origin HEAD --follow-tags

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 'v${{ inputs.releaseVersion }}' \
            --title 'v${{ inputs.releaseVersion }}' --generate-notes
