name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify runs the whole quality pipeline, including the inject-maven-plugin
      # invoker integration tests. Those child builds resolve only from ~/.m2
      # (src/it/settings.xml), which this build fills first.
      - name: Build and verify
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload test reports and integration test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */target/surefire-reports/
            inject-maven-plugin/target/it/*/build.log
          if-no-files-found: ignore
